# tmux config — converted from macOS (jasontwong/configs) for Ubuntu

# zsh is not installed on this box; install zsh and swap this back if you want it
set-option -g default-shell /usr/bin/bash

# change action binding
set -g prefix C-a

# binds
unbind Up
unbind Down
unbind Left
unbind Right
bind C-a last-window
bind r source-file ~/.tmux.conf
bind s split-window -v
bind v split-window -h
bind N next-window -a
bind P previous-window -a
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind S choose-session
bind -r < resize-pane -L 3
bind -r > resize-pane -R 3
bind -r - resize-pane -D 3
bind -r + resize-pane -U 3
bind C-k send-keys -R \; clear-history

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send -X begin-selection

# Linux clipboard: wl-copy under Wayland, xclip under X11
# (replaces macOS `reattach-to-user-namespace pbcopy`)
bind-key -T copy-mode-vi y send -X copy-pipe 'if [ -n "$WAYLAND_DISPLAY" ]; then wl-copy; else xclip -selection clipboard -i; fi'

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe 'if [ -n "$WAYLAND_DISPLAY" ]; then wl-copy; else xclip -selection clipboard -i; fi'

# helpers
set -g history-limit 50000
setw -g monitor-activity on
set -g visual-activity on
setw -g mode-keys vi

# visuals
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g status-bg colour235
set -g status-fg colour15
set -g status-left-length 30
set -g status-right-length 50
set -g status-left '#[fg=colour10](#S) #[default]'
set -g status-right '#[fg=colour10]%H:%M#[default]'
set -g window-status-current-style 'bg=red'

# emacs
set -s escape-time 0
